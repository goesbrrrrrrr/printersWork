####################################################################################################
#  VOSTOK 8.8 (IDEX)  •  BTT Octopus Max EZ (STM32H723)  •  klipper mainline
#--------------------------------------------------------------------------------------------------
#  КАК УСТРОЕН ЭТОТ КОНФИГ
#
#  Всё разбито на файлы по смыслу — так проще искать и править, и обновление одного узла не задевает
#  остальные. Порядок include ниже менять не надо: klipper читает файлы сверху вниз, и если один и
#  тот же параметр встретится дважды, применится тот, что прочитан ПОЗЖЕ.
#
#    motors.cfg      — моторы осей, драйверы, размеры поля
#    homing.cfg      — парковка (G28) с разведением голов
#    extruders.cfg   — две подачи и два хотэнда
#    bed.cfg         — стол: нагрев, защиты, выравнивание по нескольким моторам Z
#    probe.cfg       — датчик автоуровня, карта высот, точки под винты стола
#    fans.cfg        — обдувы, вентиляторы хотэндов и отсека электроники
#    macros/*.cfg    — макросы: смена голов, офсеты, стол, старт/конец печати
#    variables.cfg   — сюда принтер сам записывает откалиброванные смещения. Руками не трогать.
#
#  ВАЖНО ПЕРЕД ПЕРВЫМ ЗАПУСКОМ
#  Все строки, помеченные "!!!", нужно проверить и подставить свои значения. Их список целиком —
#  в файле README_конфиг.md, там же порядок первого включения. Не включайте нагрев и не запускайте
#  G28, пока не пройдёте этот список.
####################################################################################################

[include motors.cfg]
[include homing.cfg]
[include extruders.cfg]
[include bed.cfg]
[include probe.cfg]
[include fans.cfg]
[include macros/idex.cfg]
[include macros/offsets.cfg]
[include macros/bed_screws.cfg]
[include macros/mesh.cfg]
[include macros/print.cfg]

####################################################################################################
# Плата
####################################################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3C000B000751313339373836-if00
restart_method: command

####################################################################################################
# Кинематика и лимиты
####################################################################################################

[printer]
kinematics: cartesian
max_velocity: 400          # !!! стартовые значения, намеренно скромные.
max_accel: 4000            # !!! поднимать после того, как машина поедет и будут сняты шейперы
max_z_velocity: 15
max_z_accel: 200
square_corner_velocity: 5

####################################################################################################
# Сервисные секции
####################################################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: ~/printer_data/config/variables.cfg

[pause_resume]
[display_status]
[respond]
[exclude_object]
[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 3600

[skew_correction]

####################################################################################################
# Температура электроники
####################################################################################################

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

