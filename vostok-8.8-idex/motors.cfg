####################################################################################################
#  МОТОРЫ, ДРАЙВЕРЫ, РАЗМЕРЫ ПОЛЯ
#--------------------------------------------------------------------------------------------------
#    область печати 350 × 350 × 400, плита стола 350 × 400 × 4
#    шкивы 16 зубьев, моторы 17HS4401 (1,8°, 1,7 А номинал)
#    ось Z — четыре стойки, четыре мотора, ШВП 1204 (4 мм за оборот)
#    драйверы TMC2209 на всех осях
#    концевики: два кнопочных по Y спереди, две оптики по Z, по X и U концевиков нет
#
#  РАСКЛАДКА ПО СЛОТАМ ПЛАТЫ 
#
#    Motor1  — X, левая печатающая голова        концевик M1-STOP   (PF0)
#    Motor2  — U, правая печатающая голова       концевик M2-STOP   (PF2)
#    Motor3  — Y левый                           концевик M3-STOP   (PF4)
#    Motor4  — Y правый                          концевик M4-DET    (PF3)
#    Motor5  — Z1 (перед слева)                  оптика  M5-DET     (PF1)
#    Motor6  — Z2 (перед справа)
#    Motor7  — Z3 (зад справа)
#    Motor8  — Z4 (зад слева)
#    Motor9  — подача левой головы (T0)
#    Motor10 — подача правой головы (T1)
####################################################################################################

####################################################################################################
# Ось X — левая печатающая голова (Motor1)
#--------------------------------------------------------------------------------------------------
# КОНЦЕВИКОВ ПО X И U НЕТ, парковка бесконцевиковаяф.
#
# ЧТО НУЖНО СДЕЛАТЬ НА ПЛАТЕ: поставить джамперы DIAG на слотах Motor1 и Motor2. Без них сигнал от
# драйвера просто никуда не приходит.
#
# Если позже захотите поставить обычные концевики, вариант с ними лежит в конце файла.
####################################################################################################

[stepper_x]
step_pin: PC13
dir_pin: PC14                 # !!! проверяется на живой машине, см. README пункт 4
enable_pin: !PE6
microsteps: 32
rotation_distance: 16         # шкив 16 зубьев + редукция 1:2
full_steps_per_rotation: 200  # мотор 17HS4401, шаг 1,8°
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -25         # !!! координата сопла левой головы в упоре слева. Мерится по README
position_min: -25             # !!! равно position_endstop
position_max: 350             # правый край области печати
homing_speed: 8               # один оборот мотора за две секунды
homing_retract_dist: 0        # обязательно ноль, см. шапку

####################################################################################################
# Ось U — правая печатающая голова (Motor2)
#--------------------------------------------------------------------------------------------------
# safe_distance — минимальный зазор между соплами, ближе которого klipper не даст головам сойтись.
# Это защита от лобового столкновения, работает и вручную, и во время печати.
####################################################################################################

[dual_carriage]
axis: x
safe_distance: 60             # !!! заведомо с запасом, см. пояснение ниже. После замера уменьшить
step_pin: PE4
dir_pin: !PE5                 # !!! правая голова обычно едет зеркально левой
enable_pin: !PE3
microsteps: 32
rotation_distance: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_dual_carriage:virtual_endstop
position_endstop: 375         # !!! координата правой головы в упоре справа
position_min: 0
position_max: 375             # !!! равно position_endstop
homing_speed: 8
homing_retract_dist: 0

# ПРО safe_distance
# Это минимальный зазор между соплами, ближе которого klipper просто не выполнит команду движения.
# Защита от лобового столкновения голов, работает и в ручном режиме, и во время печати.
#
# Точное число можно получить только замером на вашей машине: выключить питание, свести головы
# руками до упора друг в друга и замерить расстояние между кончиками сопел. Ставить надо это
# значение, можно на полмиллиметра меньше — чтобы парковочные координаты не упирались в проверку
# из-за округления. Меньше ставить нельзя: klipper разрешит свести головы ближе, чем они физически
# могут, и они встретятся.
#
# Пока стоит 60 — намеренно с запасом, до вашего замера. Откуда взялась оценка:
#   - корпус головы LPH по моделям K3D — 38 мм в ширину, кронштейн крепления к каретке — 50 мм.
#     Что из этого упрётся первым, зависит от того, как собраны обдувы, поэтому берём большее;
#   - на трёх реальных востоках этого поколения, которые я настраивал, вышло 42, 44 и 47 мм;
#   - в официальном конфиге девятого востока стоит 41.9, но там уже другая голова.
# То есть реальное значение почти наверняка ляжет между 40 и 50, и 60 накрывает весь диапазон с
# запасом в десять миллиметров. Пока значение завышено, вы теряете немного поля в режимах копии и
# зеркала — и ничего больше. Заниженное значение стоило бы двух голов, поэтому и перестраховываемся.

####################################################################################################
# Ось Y — портал на двух моторах (Motor3 = левый, Motor4 = правый)
#--------------------------------------------------------------------------------------------------
# Концевики стоят спереди, значит парковка идёт "на себя", в ноль координат. У каждого мотора свой
# концевик: каждая сторона портала едет до своего и там останавливается. Так перекос портала
# выбирается механически при каждой парковке — ради этого второй концевик и ставят.
####################################################################################################

[stepper_y]
step_pin: PE1
dir_pin: PE0                  # !!!
enable_pin: !PE2
microsteps: 32
rotation_distance: 32         # шкив 16 зубьев, привод прямой
full_steps_per_rotation: 200
endstop_pin: ^PF4             # !!! кнопка. Если состояние инверсное — ^!PF4
position_endstop: 0           # концевики спереди, парковка в ноль
position_min: 0
position_max: 350
homing_speed: 40
homing_retract_dist: 5
second_homing_speed: 10

[stepper_y1]
step_pin: PB8
dir_pin: PB9                  # !!! стороны портала должны ехать в одну сторону, не навстречу
enable_pin: !PB7
microsteps: 32
rotation_distance: 32
full_steps_per_rotation: 200
endstop_pin: ^PF3             # !!! второй концевик портала

####################################################################################################
# Ось Z — стол на четырёх винтах (Motor5...Motor8)
#--------------------------------------------------------------------------------------------------
#
# СЕЙЧАС ВКЛЮЧЕН ВАРИАНТ БЕЗ ПРОБЫ. 
#
# КОГДА ПРИЕДЕТ ДАТЧИК, переключаем на него: в этой секции закомментировать endstop_pin и
# position_endstop оптики, раскомментировать строку probe:z_virtual_endstop, а в probe.cfg
# раскомментировать блок датчика. После этого станут доступны выравнивание стола по четырём моторам
# (Z_TILT_ADJUST) и карта высот. 
####################################################################################################

[stepper_z]
step_pin: PB5
dir_pin: PB4                  # !!! положительное направление — стол ВНИЗ, от сопла
enable_pin: !PB6
microsteps: 32
rotation_distance: 4          # ШВП 1204
full_steps_per_rotation: 200
endstop_pin: ^PF1             # !!! оптика. У большинства оптопар состояние инверсное: ^!PF1
position_endstop: 0           # !!! на сколько сопло выше стола в момент срабатывания оптики
#endstop_pin: probe:z_virtual_endstop   # включить, когда приедет датчик автоуровня
position_min: -3              # запас вниз, чтобы можно было опустить сопло ниже нуля при калибровке
position_max: 400
homing_speed: 8
homing_retract_dist: 3
second_homing_speed: 2

[stepper_z1]
step_pin: PG15
dir_pin: PB3                  # !!!
enable_pin: !PD5
microsteps: 32
rotation_distance: 4
full_steps_per_rotation: 200

[stepper_z2]
step_pin: PD3
dir_pin: PD2                  # !!!
enable_pin: !PD4
microsteps: 32
rotation_distance: 4
full_steps_per_rotation: 200

[stepper_z3]
step_pin: PA10
dir_pin: PA9                  # !!!
enable_pin: !PA15
microsteps: 32
rotation_distance: 4
full_steps_per_rotation: 200

####################################################################################################
# ДРАЙВЕРЫ TMC2209
####################################################################################################

[tmc2209 stepper_x]
uart_pin: PG14
diag_pin: ^PF0
driver_SGTHRS: 100            # !!! подбирается, порядок в README
run_current: 1.0
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 dual_carriage]
uart_pin: PG13
diag_pin: ^PF2
driver_SGTHRS: 100            # !!! подбирается отдельно от левой головы
run_current: 1.0
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PG12
run_current: 1.0
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_y1]
uart_pin: PG11
run_current: 1.0              # строго такой же, как у stepper_y
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PG10
run_current: 0.8              # винтам столько не нужно, но стол тяжёлый
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_z1]
uart_pin: PG9
run_current: 0.8
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_z2]
uart_pin: PD7
run_current: 0.8
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[tmc2209 stepper_z3]
uart_pin: PD6
run_current: 0.8
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

####################################################################################################
# ЕСЛИ ПОЗЖЕ ЗАХОТИТЕ ПОСТАВИТЬ ОБЫЧНЫЕ КОНЦЕВИКИ ПО X И U
#--------------------------------------------------------------------------------------------------
#
# Если решите поставить, то два кнопочных концевика — один в левой парковке, второй в правой,
# провода в разъёмы M1-STOP и M2-STOP. В конфиге поменять четыре вещи:
#
#   в [stepper_x]:        endstop_pin: ^PF0        (если сработает наоборот — ^!PF0)
#                         homing_retract_dist: 5
#                         homing_speed: 40
#                         second_homing_speed: 10
#   в [dual_carriage]:    то же самое, но пин ^PF2
#   в [tmc2209 stepper_x] и [tmc2209 dual_carriage]: убрать строки diag_pin и driver_SGTHRS
#   в homing.cfg:         в макросе _HOME_CARRIAGES убрать паузу G4 P2000 и обе строки
#                         SET_TMC_CURRENT — с кнопками ни пауза, ни понижение тока не нужны
####################################################################################################
