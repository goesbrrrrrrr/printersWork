####################################################################################################
#  ВЕНТИЛЯТОРЫ
#--------------------------------------------------------------------------------------------------
#    FAN0 (PA6) — обдув модели левой головы     FAN3 (PA3) — обдув хотэнда правой головы
#    FAN1 (PA5) — обдув модели правой головы    FAN4 (PA1) — вентилятор отсека электроники
#    FAN2 (PA4) — обдув хотэнда левой головы    FAN5 (PF8), FAN6 (PA2) — свободны
#
####################################################################################################

[fan_generic fan_t0]
pin: PA6
kick_start_time: 0.2           
off_below: 0.10                

[fan_generic fan_t1]
pin: PA5
kick_start_time: 0.2
off_below: 0.10

[heater_fan hotend_fan_t0]
pin: PA4
heater: extruder
heater_temp: 50
fan_speed: 1.0

[heater_fan hotend_fan_t1]
pin: PA3
heater: extruder1
heater_temp: 50
fan_speed: 1.0

[controller_fan electronics_fan]
pin: PA1
tachometer_pin: PC3
fan_speed: 0.6
idle_timeout: 120
idle_speed: 0.3
heater: heater_bed
stepper: stepper_x, stepper_y, stepper_z

####################################################################################################
# Управление обдувом модели из слайсера
####################################################################################################

[gcode_macro M106]
description: Обдув модели. Сам направляет поток на активную голову
gcode:
    {% set speed = (params.S|default(255)|float / 255.0)|round(3) %}
    {% set mode_t1 = printer.dual_carriage.carriage_1|default('INACTIVE') %}
    {% if 'P' in params %}
        # слайсер явно указал номер вентилятора
        {% if params.P|int == 0 %}
            SET_FAN_SPEED FAN=fan_t0 SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=fan_t1 SPEED={speed}
        {% endif %}
    {% elif mode_t1 in ['COPY', 'MIRROR'] %}
        # печатают обе головы разом — обдув нужен обеим
        SET_FAN_SPEED FAN=fan_t0 SPEED={speed}
        SET_FAN_SPEED FAN=fan_t1 SPEED={speed}
    {% elif printer.toolhead.extruder == 'extruder' %}
        SET_FAN_SPEED FAN=fan_t0 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN=fan_t1 SPEED={speed}
    {% endif %}

[gcode_macro M107]
description: Выключить обдув модели на обеих головах
gcode:
    SET_FAN_SPEED FAN=fan_t0 SPEED=0
    SET_FAN_SPEED FAN=fan_t1 SPEED=0

