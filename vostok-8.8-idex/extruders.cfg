####################################################################################################
#  ДВЕ ПОДАЧИ И ДВА ХОТЭНДА
#--------------------------------------------------------------------------------------------------
#    extruder   — левая голова (T0): мотор Motor9, нагреватель HE0 (PF6), термистор TH0 (PB0)
#    extruder1  — правая голова (T1): мотор Motor10, нагреватель HE1 (PA0), термистор TH1 (PC5)
#
#  ПРО rotation_distance. Значение ниже стартовое, его обязательно калибруют: отмерить на прутке 120 мм от входа в
#  подачу, выдавить 100 мм при разогретом хотэнде, замерить остаток. Новое значение =
#  старое × (сколько реально ушло) / 100. Делается один раз на каждую голову.
####################################################################################################

####################################################################################################
# Левая голова — T0
####################################################################################################

[extruder]
step_pin: PA8
dir_pin: PC7                    # !!! если подача крутит наоборот — поставить !PC7
enable_pin: !PC9
microsteps: 32
rotation_distance: 5.7          # !!! стартовое значение, калибруется (см. шапку файла)
full_steps_per_rotation: 200    # !!! мотор подачи 1,8° = 200, 0,9° = 400
nozzle_diameter: 0.400          # !!! диаметр сопла
filament_diameter: 1.750

heater_pin: PF6                 # HE0
sensor_pin: PB0                 # TH0
sensor_type: Generic 3950       # !!! обычный 100K NTC. Для PT1000 — две строки ниже вместо этой
#sensor_type: PT1000
#pullup_resistor: 2200          # только для PT1000 и только вместе с джампером на плате

min_temp: 0
max_temp: 300                   # !!! по паспорту вашего хотэнда, не выше
min_extrude_temp: 170           # холодная подача запрещена: бережёт шестерни и сопло

# Значения PID заведомо неверные — их надо получить командой:
#   PID_CALIBRATE HEATER=extruder TARGET=240
# и затем сохранить кнопкой SAVE_CONFIG в веб-интерфейсе.
control: pid
pid_Kp: 22.0
pid_Ki: 1.10
pid_Kd: 110.0
pressure_advance: 0.03
pressure_advance_smooth_time: 0.02

max_extrude_only_distance: 200
max_extrude_cross_section: 5  

[tmc2209 extruder]
uart_pin: PG8
run_current: 0.6                # !!! под мотор подачи. 
sense_resistor: 0.110          
interpolate: False
stealthchop_threshold: 0

####################################################################################################
# Правая голова — T1
####################################################################################################

[extruder1]
step_pin: PG6
dir_pin: PC6                    # !!!
enable_pin: !PC8
microsteps: 32
rotation_distance: 5.7          # !!! калибруется отдельно от первой головы
full_steps_per_rotation: 200
nozzle_diameter: 0.400          # !!!
filament_diameter: 1.750

heater_pin: PA0                 # HE1
sensor_pin: PC5                 # TH1
sensor_type: Generic 3950       # !!! как и у первой головы
#sensor_type: PT1000
#pullup_resistor: 2200

min_temp: 0
max_temp: 300                   # !!!
min_extrude_temp: 170
control: pid
pid_Kp: 22.0
pid_Ki: 1.10
pid_Kd: 110.0

pressure_advance: 0.03
pressure_advance_smooth_time: 0.02

max_extrude_only_distance: 200
max_extrude_cross_section: 5

[tmc2209 extruder1]
uart_pin: PG7
run_current: 0.6                # !!!
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

####################################################################################################
# Датчики окончания филамента
#--------------------------------------------------------------------------------------------------
# Раскомментировать, если стоят. 
