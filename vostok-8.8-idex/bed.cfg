####################################################################################################
#  СТОЛ: НАГРЕВ И ВЫРАВНИВАНИЕ
#--------------------------------------------------------------------------------------------------
#  Плита 350 × 400 × 4, грелка на 220 В через твердотельное реле, термистор 100K, девять винтов.
####################################################################################################

####################################################################################################
# Нагрев
#--------------------------------------------------------------------------------------------------
# Грелка на 220 В управляется не платой напрямую, а через реле.
# Если стол вдруг поведёт себя наоборот — греет при выключенном нагреве — значит у реле инверсный
# вход, тогда heater_pin надо записать как !PF5.
####################################################################################################

[heater_bed]
heater_pin: PF5                 # HB
sensor_pin: PB1                 # TB
sensor_type: Generic 3950       # обычный 100K NTC, как у вашей грелки
min_temp: 0
max_temp: 120                   # !!! сверить с паспортом грелки
max_power: 1.0

# Коэффициенты ниже — заглушка. Обязательно прогнать PID_CALIBRATE HEATER=heater_bed TARGET=80,
# потом SAVE_CONFIG. 
control: pid
pid_Kp: 60.0
pid_Ki: 1.70
pid_Kd: 500.0

[verify_heater heater_bed]
check_gain_time: 300
heating_gain: 1
hysteresis: 5
max_error: 200

####################################################################################################
# Выравнивание стола по четырём моторам Z
####################################################################################################

[z_tilt]
z_positions:                    # !!! порядок: Z1 перед слева, Z2 перед справа, Z3 зад справа, Z4 зад слева
    0, 0
    350, 0
    350, 350
    0, 350
points:                         # !!! положение сопла при замере у каждой стойки
    50, 30
    340, 30
    340, 320
    50, 320
speed: 200
horizontal_move_z: 8
retries: 5                     
retry_tolerance: 0.1           
