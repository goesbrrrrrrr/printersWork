####################################################################################################
#  ВЫРАВНИВАНИЕ СТОЛА
####################################################################################################

[gcode_macro LEVEL_BED]
description: Убрать перекос стола по моторам Z
gcode:
    {% if printer.probe is not defined %}
        { action_raise_error("Нужен датчик автоуровня. Пока его нет, стол выставляется винтами: BED_SCREWS_MANUAL") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PARK_U
    T0 PARK=0
    G90
    G1 Z10 F900
    Z_TILT_ADJUST
    G1 Z10 F900
    RESPOND MSG="Перекос стола выровнен"

[gcode_macro BED_MESH_AUTO]
description: Выровнять перекос и снять карту высот стола
gcode:
    {% if printer.probe is not defined %}
        { action_raise_error("Нужен датчик автоуровня — карту высот снимать нечем") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PARK_U
    T0 PARK=0
    BED_MESH_CLEAR
    LEVEL_BED
    G28 Z
    BED_MESH_CALIBRATE
    G1 Z15 F900
    PARK_BOTH
    RESPOND MSG="Карта снята и применена. Чтобы она пережила перезагрузку - MESH_SAVE NAME=имя"

[gcode_macro MESH_SAVE]
description: Сохранить снятую карту под именем. Пример - MESH_SAVE NAME=abs_100
gcode:
    BED_MESH_PROFILE SAVE={params.NAME|default('default')}
    RESPOND MSG="Карта сохранена. Сейчас прошивка перезапустится, это нормально"
    SAVE_CONFIG

[gcode_macro BED_MESH_ADAPTIVE]
description: Снять карту только под деталью
gcode:
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
