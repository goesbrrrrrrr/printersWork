####################################################################################################
#  ЗАЗОР МЕЖДУ СОПЛОМ И СТОЛОМ (Z-OFFSET)
#--------------------------------------------------------------------------------------------------
#  Команды:
#    CALIBRATE_Z_OFFSET_T0  — калибровка зазора левой головы, по бумажке, с кнопками в интерфейсе
#    CALIBRATE_Z_OFFSET_T1  — то же для правой
#    SET_Z_OFFSET_T0 OFFSET=0.15   — вписать значение руками, если оно уже известно
#    SHOW_OFFSETS                  — показать, что сейчас записано
####################################################################################################

[gcode_macro CALIBRATE_Z_OFFSET_T0]
description: Калибровка зазора сопло-стол для левой головы
gcode:
    {% set h = printer['gcode_macro _HOMING_SETTINGS'] %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    PARK_U
    T0 PARK=0
    G1 Z10 F900
    G1 X{h.z_home_x} Y{h.z_home_y} F{printer['gcode_macro _IDEX'].travel_speed}
    SET_GCODE_OFFSET Z=3 MOVE=0
    SAVE_VARIABLE VARIABLE=t0_z_offset VALUE=3
    G1 Z0 F300
    _OFFSET_PROMPT NAME="левой головы"

[gcode_macro CALIBRATE_Z_OFFSET_T1]
description: Калибровка зазора сопло-стол для правой головы
gcode:
    {% set h = printer['gcode_macro _HOMING_SETTINGS'] %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    PARK_X
    T1 PARK=0
    G1 Z10 F900
    G1 X{h.z_home_x} Y{h.z_home_y} F{printer['gcode_macro _IDEX'].travel_speed}
    SET_GCODE_OFFSET Z=3 MOVE=0
    SAVE_VARIABLE VARIABLE=t1_z_offset VALUE=3
    G1 Z0 F300
    _OFFSET_PROMPT NAME="правой головы"

[gcode_macro _OFFSET_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Калибровка зазора {params.NAME|default('')}"
    RESPOND TYPE=command MSG="action:prompt_text Подложите лист бумаги и опускайте сопло, пока бумага не начнёт идти с лёгким трением. Затем нажмите ГОТОВО."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button -0.5|_OFFSET_MOVE Z=-0.5|primary"
    RESPOND TYPE=command MSG="action:prompt_button -0.1|_OFFSET_MOVE Z=-0.1|primary"
    RESPOND TYPE=command MSG="action:prompt_button -0.05|_OFFSET_MOVE Z=-0.05|primary"
    RESPOND TYPE=command MSG="action:prompt_button -0.01|_OFFSET_MOVE Z=-0.01|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button +0.5|_OFFSET_MOVE Z=0.5|primary"
    RESPOND TYPE=command MSG="action:prompt_button +0.1|_OFFSET_MOVE Z=0.1|primary"
    RESPOND TYPE=command MSG="action:prompt_button +0.05|_OFFSET_MOVE Z=0.05|primary"
    RESPOND TYPE=command MSG="action:prompt_button +0.01|_OFFSET_MOVE Z=0.01|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button ГОТОВО|_END_OFFSET_CALIBRATION"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _OFFSET_MOVE]
gcode:
    {% set z = params.Z|default(0)|float %}
    {% set v = printer.save_variables.variables %}
    SET_GCODE_OFFSET Z_ADJUST={z} MOVE=1
    {% if printer.toolhead.extruder == 'extruder' %}
        {% set new = v.t0_z_offset|default(0) + z %}
        {% if new > -3 %}
            SAVE_VARIABLE VARIABLE=t0_z_offset VALUE={new}
        {% endif %}
    {% else %}
        {% set new = v.t1_z_offset|default(0) + z %}
        {% if new > -3 %}
            SAVE_VARIABLE VARIABLE=t1_z_offset VALUE={new}
        {% endif %}
    {% endif %}

[gcode_macro _END_OFFSET_CALIBRATION]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 Z20 F900
    PARK_BOTH
    SHOW_OFFSETS

####################################################################################################
# Ручная запись значений
####################################################################################################

[gcode_macro SET_Z_OFFSET_T0]
description: Вписать зазор левой головы вручную. Пример - SET_Z_OFFSET_T0 OFFSET=0.15
gcode:
    SAVE_VARIABLE VARIABLE=t0_z_offset VALUE={params.OFFSET|float}
    _APPLY_TOOL_OFFSETS
    SHOW_OFFSETS

[gcode_macro SET_Z_OFFSET_T1]
description: Вписать зазор правой головы вручную. Пример - SET_Z_OFFSET_T1 OFFSET=0.15
gcode:
    SAVE_VARIABLE VARIABLE=t1_z_offset VALUE={params.OFFSET|float}
    _APPLY_TOOL_OFFSETS
    SHOW_OFFSETS

####################################################################################################
# Подстройка зазора прямо во время печати
####################################################################################################

[gcode_macro Z_DOWN]
description: Опустить сопло на 0.01 мм и запомнить
gcode:
    _OFFSET_MOVE Z=-0.01

[gcode_macro Z_UP]
description: Поднять сопло на 0.01 мм и запомнить
gcode:
    _OFFSET_MOVE Z=0.01
