####################################################################################################
#  СТАРТ, КОНЕЦ, ПАУЗА, ОТМЕНА ПЕЧАТИ
####################################################################################################

[gcode_macro _PRINT_SETTINGS]
variable_soft_temp: 150         # температура ожидания, при ней сопло не течёт
variable_purge_x: 5             # начало полоски прочистки для левой головы, у левого края стола
variable_purge_x_t1: 345        # то же для правой — у своего края, чтобы головы не мешали
variable_purge_y: 5             # ближний край стола
variable_purge_length: 120      # длина полоски вдоль оси Y
variable_purge_amount: 25       # сколько мм прутка выдавить
variable_purge_z: 0.3           # высота сопла над столом при прочистке
gcode:

####################################################################################################
# Старт печати
####################################################################################################

[gcode_macro START_PRINT]
description: Подготовка к печати. Вызывается слайсером
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set t0 = params.EXTRUDER|default(220)|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set mode = params.MODE|default('NORMAL')|string|upper %}
    {% set s = printer['gcode_macro _PRINT_SETTINGS'] %}

    {% set t1_raw = params.EXTRUDER1|default(0)|float %}
    {% set t1 = t1_raw if t1_raw > 0 else (t0 if mode != 'NORMAL' else 0) %}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    IDEX_RESET
    M107

    # 1. Нагрев: стол на рабочую, хотэнды на мягкую.
    M140 S{bed}
    {% if t0 > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s.soft_temp}
    {% endif %}
    {% if t1 > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={s.soft_temp}
    {% endif %}

    # 2. Парковка, пока греется
    G28

    # 3. Ждём стол и убираем перекос уже на горячем
    M190 S{bed}

    # 4. Выравнивание стола и карта высот — только если подключён датчик автоуровня.
    {% if printer.probe is defined %}
        LEVEL_BED
        G28 Z
        _MESH_FOR_PRINT
    {% else %}
        RESPOND MSG="Датчик автоуровня не подключён: выравнивание стола и карта высот пропущены"
    {% endif %}

    # 5. Рабочая температура сопел
    {% if t0 > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t0}
    {% endif %}
    {% if t1 > 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t1}
    {% endif %}
    {% if t0 > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t0 - 2}
    {% endif %}
    {% if t1 > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1 - 2}
    {% endif %}

    # 6. Режим печати и прочистка
    {% if mode == 'COPY' %}
        IDEX_COPY
        _PURGE_LINE
    {% elif mode == 'MIRROR' %}
        IDEX_MIRROR
        _PURGE_LINE
    {% else %}
        {% if tool == 1 %}
            T1
        {% else %}
            T0
        {% endif %}
        _PURGE_LINE
    {% endif %}

    RESPOND MSG="Поехали"

[gcode_macro _MESH_FOR_PRINT]
gcode:
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}

# Полоска прочистки вдоль левого края стола. 
[gcode_macro _PURGE_LINE]
gcode:
    {% set s = printer['gcode_macro _PRINT_SETTINGS'] %}
    {% set x = s.purge_x if printer.toolhead.extruder == 'extruder' else s.purge_x_t1 %}
    G90
    G1 Z5 F900
    G1 X{x} Y{s.purge_y} F{printer['gcode_macro _IDEX'].travel_speed}
    G1 Z{s.purge_z} F600
    M83
    G1 E{s.purge_amount * 0.4} F300
    G1 Y{s.purge_y + s.purge_length} E{s.purge_amount * 0.6} F900
    G1 E-0.4 F1800
    G1 Z2 F600
    G92 E0

####################################################################################################
# Конец печати
####################################################################################################

[gcode_macro END_PRINT]
description: Завершение печати. Вызывается слайсером
gcode:
    M400                        # дождаться, пока отработают все движения из буфера
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E-2 F1800            # откат, чтобы не тянуло нитку и не капало
    {% endif %}
    TURN_OFF_HEATERS
    M107
    _Z_LIFT DISTANCE=10         # опустить стол, чтобы деталь не задело при парковке
    IDEX_RESET
    PARK_BOTH
    # Портал отгоняем к дальней стенке: удобнее снимать деталь
    {% set y = printer.configfile.settings.stepper_y %}
    G1 Y{y.position_max - 1} F{printer['gcode_macro _IDEX'].travel_speed}
    M84                         # выключить моторы
    BED_MESH_CLEAR
    RESPOND MSG="Печать закончена"

####################################################################################################
# Пауза, продолжение, отмена
####################################################################################################

[gcode_macro PAUSE]
description: Пауза печати
rename_existing: BASE_PAUSE
variable_extrude: 1.5
gcode:
    {% set e = printer['gcode_macro PAUSE'].extrude %}
    BASE_PAUSE
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E-{e} F1800
    {% endif %}
    _Z_LIFT DISTANCE=5
    {% if printer.toolhead.extruder == 'extruder' %}
        PARK_X
    {% else %}
        PARK_U
    {% endif %}

[gcode_macro RESUME]
description: Продолжить печать
rename_existing: BASE_RESUME
gcode:
    {% set e = printer['gcode_macro PAUSE'].extrude %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E{e} F1800
    {% else %}
        RESPOND TYPE=error MSG="Хотэнд холодный, прутком двигать нельзя"
    {% endif %}
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
description: Отменить печать
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    {% if printer.pause_resume.is_paused %}
        CLEAR_PAUSE
    {% endif %}
    _Z_LIFT DISTANCE=10
    IDEX_RESET
    PARK_BOTH
    BASE_CANCEL_PRINT
    M84
    BED_MESH_CLEAR
    RESPOND MSG="Печать отменена"

####################################################################################################
# Мелкие удобства
####################################################################################################

[gcode_macro LOAD_FILAMENT]
description: Заправить пруток в активную голову
gcode:
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E60 F300             # быстро протянуть до сопла
        G1 E40 F150             # и медленно продавить
        RESPOND MSG="Готово. Если из сопла не пошло - повторите"
    {% else %}
        RESPOND TYPE=error MSG="Сначала нагрейте хотэнд"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Выгрузить пруток из активной головы
gcode:
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E5 F300              # чуть выдавить, чтобы кончик отлип
        G1 E-100 F600
        RESPOND MSG="Пруток выгружен"
    {% else %}
        RESPOND TYPE=error MSG="Сначала нагрейте хотэнд"
    {% endif %}

[gcode_macro M600]
description: Смена прутка по коду из модели
gcode:
    PAUSE
    UNLOAD_FILAMENT
