####################################################################################################
#  IDEX: СМЕНА ГОЛОВ, ПАРКОВКИ, РЕЖИМЫ КОПИИ И ЗЕРКАЛА
#--------------------------------------------------------------------------------------------------
#    T0 / T1              — переключиться на левую / правую голову
#    PARK_X / PARK_U      — отогнать левую / правую голову в её парковку
#    PARK_BOTH            — отогнать обе
#    IDEX_COPY            — режим копии: обе головы печатают одну деталь одновременно
#    IDEX_MIRROR          — режим зеркала: вторая голова печатает зеркальную копию
#    IDEX_RESET           — вернуться в обычный режим одной головой
#    SHOW_OFFSETS         — показать сохранённые зазоры сопло-стол обеих голов
####################################################################################################

[gcode_macro _IDEX]
variable_park_safety: 0.5      
variable_travel_speed: 12000   
gcode:

####################################################################################################
# Смена головы
####################################################################################################

# variable_active — по нему Mainsail и Fluidd подсвечивают кнопку активной головы. Значение
# переключает _TOOLCHANGE; после старта klipper активна левая голова, поэтому у T0 стоит True.
[gcode_macro T0]
description: Переключиться на левую печатающую голову
variable_active: True
gcode:
    _TOOLCHANGE TOOL=0 PARK={params.PARK|default(1)}

[gcode_macro T1]
description: Переключиться на правую печатающую голову
variable_active: False
gcode:
    _TOOLCHANGE TOOL=1 PARK={params.PARK|default(1)}

[gcode_macro _TOOLCHANGE]
gcode:
    {% set tool = params.TOOL|int %}
    {% set park = params.PARK|default(1)|int %}
    {% set homed = 'x' in printer.toolhead.homed_axes %}
    {% set active = printer.toolhead.extruder %}
    {% set want = 'extruder' if tool == 0 else 'extruder1' %}

    # 2. Убрать уходящую голову к своему краю, чтобы она не капала на деталь.
    {% if park and homed and active != want %}
        {% if tool == 0 %}
            PARK_U
        {% else %}
            PARK_X
        {% endif %}
    {% endif %}

    # 3. Собственно переключение: активный экструдер, активная каретка и развязка подач
    #    (после режима копии обе подачи ходят от одной команды — здесь это отменяется).
    ACTIVATE_EXTRUDER EXTRUDER={want}
    SET_DUAL_CARRIAGE CARRIAGE={tool}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1

    # 4. Применить смещения новой головы
    _APPLY_TOOL_OFFSETS

    # 5. Подсветить в интерфейсе кнопку той головы, что сейчас активна
    SET_GCODE_VARIABLE MACRO=T0 VARIABLE=active VALUE={tool == 0}
    SET_GCODE_VARIABLE MACRO=T1 VARIABLE=active VALUE={tool == 1}

####################################################################################################
# Парковки
####################################################################################################

[gcode_macro PARK_X]
description: Отогнать левую голову в её парковку
gcode:
    {% set s = printer['gcode_macro _IDEX'] %}
    {% set cfg = printer.configfile.settings.stepper_x %}
    {% if 'x' in printer.toolhead.homed_axes %}
        SET_DUAL_CARRIAGE CARRIAGE=0
        G90
        G1 X{cfg.position_min + s.park_safety} F{s.travel_speed}
    {% else %}
        RESPOND TYPE=error MSG="Сначала парковка: G28"
    {% endif %}

[gcode_macro PARK_U]
description: Отогнать правую голову в её парковку
gcode:
    {% set s = printer['gcode_macro _IDEX'] %}
    {% set cfg = printer.configfile.settings.dual_carriage %}
    {% set back = printer.toolhead.extruder %}
    {% if 'x' in printer.toolhead.homed_axes %}
        SET_DUAL_CARRIAGE CARRIAGE=1
        G90
        G1 X{cfg.position_max - s.park_safety} F{s.travel_speed}
        # вернуть активной ту голову, что была до парковки
        {% if back == 'extruder' %}
            SET_DUAL_CARRIAGE CARRIAGE=0
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="Сначала парковка: G28"
    {% endif %}

[gcode_macro PARK_BOTH]
description: Отогнать обе головы по краям
gcode:
    PARK_U
    PARK_X
    T0 PARK=0

####################################################################################################
# Смещения голов друг относительно друга
####################################################################################################

[gcode_macro _APPLY_TOOL_OFFSETS]
gcode:
    {% set v = printer.save_variables.variables %}
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_GCODE_OFFSET Z={v.t0_z_offset|default(0)} MOVE=0
    {% else %}
        SET_GCODE_OFFSET Z={v.t1_z_offset|default(0)} MOVE=0
    {% endif %}

[gcode_macro SHOW_OFFSETS]
description: Показать сохранённые смещения голов
gcode:
    {% set v = printer.save_variables.variables %}
    RESPOND MSG="T0: Z={v.t0_z_offset|default(0)}"
    RESPOND MSG="T1: Z={v.t1_z_offset|default(0)}"

####################################################################################################
# Режимы копии и зеркала
####################################################################################################

[gcode_macro IDEX_COPY]
description: Режим копии - обе головы печатают одну и ту же деталь
gcode:
    {% set s = printer['gcode_macro _IDEX'] %}
    {% set x0 = printer.configfile.settings.stepper_x %}
    {% set safe = printer.configfile.settings.dual_carriage.safe_distance|float %}
    {% set span = (x0.position_max - 0) / 2 %}
    {% set dist = params.DISTANCE|default(span)|float %}

    {% if dist < safe %}
        { action_raise_error("Расстояние между головами %.1f мм меньше безопасного %.1f мм" % (dist, safe)) }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    IDEX_RESET
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X0 F{s.travel_speed}
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{dist} F{s.travel_speed}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    RESPOND MSG="Режим копии включён. Расстояние между головами {dist} мм"

[gcode_macro IDEX_MIRROR]
description: Режим зеркала - правая голова печатает зеркальную копию
gcode:
    {% set s = printer['gcode_macro _IDEX'] %}
    {% set x0 = printer.configfile.settings.stepper_x %}
    {% set safe = printer.configfile.settings.dual_carriage.safe_distance|float %}
    {% set center = params.CENTER|default((x0.position_max) / 2)|float %}
    # Головы расставляются симметрично относительно оси зеркала, но не ближе безопасной дистанции
    # друг к другу — иначе klipper справедливо не пустит движение.
    {% set half = safe / 2 + 10 %}

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    IDEX_RESET
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{center - half} F{s.travel_speed}
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{center + half} F{s.travel_speed}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    RESPOND MSG="Режим зеркала включён. Ось симметрии X={center}. Деталь не должна подходить к этой оси ближе чем на {half} мм, иначе головы упрутся в защиту"

[gcode_macro IDEX_RESET]
description: Вернуться в обычный режим печати одной головой
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    T0 PARK=0
