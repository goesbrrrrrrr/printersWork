####################################################################################################
#  ВИНТЫ СТОЛА
####################################################################################################

####################################################################################################
# Автоматический расчёт
####################################################################################################

[gcode_macro SCREWS_ADJUST]
description: Обойти винты стола датчиком и посчитать, куда крутить
gcode:
    {% if printer.probe is not defined %}
        { action_raise_error("Нужен датчик автоуровня. Пока его нет — BED_SCREWS_MANUAL, по бумажке") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PARK_U
    T0 PARK=0
    G90
    G1 Z10 F900
    SCREWS_TILT_CALCULATE
    RESPOND MSG="Крутите винты по подсказкам выше, затем повторите команду. Норма - когда все винты в пределах 5 минут"

####################################################################################################
# Ручная регулировка по бумажке
####################################################################################################

# Девять винтов сеткой три на три. Координаты — положение сопла над винтом, посчитаны для стола
# 350 × 350 с винтами в 20 мм от краёв. Порядок в списке = порядок кнопок в окне.
[gcode_macro _BED_SCREWS]
variable_screws: [[20, 20, "перед слева"], [175, 20, "перед центр"], [330, 20, "перед справа"], [20, 175, "центр слева"], [175, 175, "центр"], [330, 175, "центр справа"], [20, 330, "зад слева"], [175, 330, "зад центр"], [330, 330, "зад справа"]]
variable_z_hop: 10
gcode:

[gcode_macro BED_SCREWS_MANUAL]
description: Ручная регулировка винтов стола по бумажке
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PARK_U
    T0 PARK=0
    G90
    RESPOND TYPE=command MSG="action:prompt_begin Регулировка винтов стола"
    RESPOND TYPE=command MSG="action:prompt_text Нажимайте кнопку нужного винта - голова встанет над ним и опустится к столу. Подложите бумагу и крутите винт, пока она не пойдёт с лёгким трением. Обойдите все винты по кругу дважды."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for s in printer['gcode_macro _BED_SCREWS'].screws %}
        RESPOND TYPE=command MSG="action:prompt_button {s[2]}|_MOVE_TO_SCREW X={s[0]} Y={s[1]}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button ГОТОВО|_END_BED_SCREWS"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _MOVE_TO_SCREW]
gcode:
    {% set s = printer['gcode_macro _BED_SCREWS'] %}
    G90
    G1 Z{s.z_hop} F900
    G1 X{params.X} Y{params.Y} F{printer['gcode_macro _IDEX'].travel_speed}
    G1 Z0 F300

[gcode_macro _END_BED_SCREWS]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 Z20 F900
    PARK_BOTH
    RESPOND MSG="Готово. Дальше имеет смысл снять карту высот: BED_MESH_AUTO"
