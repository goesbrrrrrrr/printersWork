####################################################################################################
#  ДАТЧИК АВТОУРОВНЯ CR TOUCH, КАРТА ВЫСОТ, ВИНТЫ СТОЛА
#--------------------------------------------------------------------------------------------------
#  CR Touch ол
# ПОДКЛЮЧЕНИЕ. У датчика пять проводов, они идут в разъём платы с подписью PROBE (BLTouch):
#      коричневый — GND, красный — 5V, жёлтый — управление (пин PB14)
#      чёрный — GND, белый — сигнал (пин PB15)
#
#  ДАТЧИК ЕЩЁ НЕТ, поэтому блок ниже закомментирован. Это не перестраховка: klipper при
#  запуске опрашивает датчик, и, не получив ответа, останавливается с ошибкой "BLTouch failed to
#  verify sensor state" — принтер не заработает вообще, даже без всякой печати.
#
#  КОГДА ПОДКЛЮЧИТЕ, три шага:
#    1. раскомментировать блок [bltouch] ниже;
#    2. в motors.cfg, секция [stepper_z]: закомментировать endstop_pin с оптикой и position_endstop,
#       раскомментировать строку endstop_pin: probe:z_virtual_endstop;
#    3. замерить смещение щупа относительно сопла, вписать в x_offset и y_offset, затем выполнить
#       PROBE_CALIBRATE и SAVE_CONFIG — z_offset klipper запишет сам.
#  После этого заработают выравнивание стола по четырём моторам, карта высот и авторасчёт винтов.
#
#  Датчик ставится на ЛЕВУЮ голову (T0)
####################################################################################################

#[bltouch]
#sensor_pin: ^PB15              # белый провод. Если QUERY_PROBE покажет состояние наоборот — ^!PB15
#control_pin: PB14              # жёлтый провод
#x_offset: -30                  # !!! замерить: насколько щуп левее сопла. Минус — левее
#y_offset: 0                    # !!! насколько щуп впереди сопла. Минус — впереди
#z_offset: 2.0                 
#speed: 5                      
#lift_speed: 15                
#samples: 2                    
#samples_result: median        
#sample_retract_dist: 3        
#samples_tolerance: 0.05       
#samples_tolerance_retries: 3

####################################################################################################
# Карта высот стола
####################################################################################################

[bed_mesh]
speed: 200
horizontal_move_z: 8
mesh_min: 10, 10                
mesh_max: 315, 340              
probe_count: 7, 7               # 49 точек на 350 мм — по точке каждые 50 мм
algorithm: bicubic
zero_reference_position: 175, 175   # центр стола, относительно него считается вся карта
adaptive_margin: 5
fade_start: 1
fade_end: 10                    # компенсация плавно сходит на нет к высоте 10 мм

####################################################################################################
# Винты стола 
####################################################################################################

[screws_tilt_adjust]
screw1: 205, 175                # !!! центр — опорный
screw1_name: центр
screw2: 50, 20                  # !!!
screw2_name: перед слева
screw3: 205, 20                 # !!!
screw3_name: перед центр
screw4: 345, 20                 # !!! не 360: сопло дальше 350 не уедет
screw4_name: перед справа
screw5: 345, 175                # !!!
screw5_name: центр справа
screw6: 345, 330                # !!!
screw6_name: зад справа
screw7: 205, 330                # !!!
screw7_name: зад центр
screw8: 50, 330                 # !!!
screw8_name: зад слева
screw9: 50, 175                 # !!!
screw9_name: центр слева
horizontal_move_z: 8
speed: 200
screw_thread: CW-M4             # !!! винты М4 с правой резьбой. М3 — CW-M3, М5 — CW-M5
