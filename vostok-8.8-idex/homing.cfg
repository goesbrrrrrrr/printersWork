####################################################################################################
#  ПАРКОВКА (G28)
####################################################################################################

[gcode_macro _HOMING_SETTINGS]
variable_z_home_x: 175        # центр стола по X
variable_z_home_y: 175        # центр стола по Y
variable_z_hop: 10             # на сколько опустить стол перед движениями
variable_travel_speed: 8000  # скорость перемещений при парковке, мм/мин
variable_home_current: 0.7    # !!! ток моторов X и U на время бесконцевиковой парковки
variable_backoff: 2           # на сколько отъехать от упора сразу после парковки
gcode:

[gcode_macro _Z_LIFT]
gcode:
    {% set d = params.DISTANCE|default(5)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur = printer.toolhead.position.z|float %}
    {% set lift = [d, max_z - cur]|min %}
    {% if lift > 0.05 %}
        G91
        G1 Z{lift} F900
        G90
    {% endif %}

[homing_override]
axes: xyz
gcode:
    {% set s = printer['gcode_macro _HOMING_SETTINGS'] %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set do_x = 'X' in params %}
    {% set do_y = 'Y' in params %}
    {% set do_z = 'Z' in params %}
    {% set do_all = not (do_x or do_y or do_z) %}

    {% set need_y = do_all or do_y or (do_z and 'y' not in homed) %}
    {% set need_x = do_all or do_x or (do_z and 'x' not in homed) %}
    {% set need_z = do_all or do_z %}

    # --- 1. увести стол от сопла -----------------------------------------------------------------
    {% if 'z' not in homed %}
        SET_KINEMATIC_POSITION Z=0
    {% endif %}
    _Z_LIFT DISTANCE={s.z_hop}

    # --- 2. портал -------------------------------------------------------------------------------
    {% if need_y %}
        G28 Y
    {% endif %}

    # --- 3. головы -------------------------------------------------------------------------------
    {% if need_x %}
        _HOME_CARRIAGES
    {% endif %}

    # --- 4. ось Z --------------------------------------------------------------------------------
    {% if need_z %}
        SET_DUAL_CARRIAGE CARRIAGE=0
        G90
        G1 X{s.z_home_x} Y{s.z_home_y} F{s.travel_speed}
        G28 Z
        G1 Z{s.z_hop} F900
    {% endif %}

    # --- 5. активной оставляем левую голову ------------------------------------------------------
    {% if need_x or 'x' in homed %}
        T0 PARK=0
    {% endif %}


[gcode_macro _HOME_CARRIAGES]
gcode:
    {% set s = printer['gcode_macro _HOMING_SETTINGS'] %}
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set run_u = printer.configfile.settings['tmc2209 dual_carriage'].run_current %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={s.home_current}
    SET_TMC_CURRENT STEPPER=dual_carriage CURRENT={s.home_current}
    G4 P2000
    G28 X

    # Отъезд от упоров: правая голова упирается справа и отъезжает влево, левая наоборот.
    SET_DUAL_CARRIAGE CARRIAGE=1
    G91
    G1 X-{s.backoff} F1800
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{s.backoff} F1800
    G90

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=dual_carriage CURRENT={run_u}
